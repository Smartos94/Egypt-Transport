name: Update Egyptian Railways Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run reason'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape egypttrains.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape_egypt_trains.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'

      - name: Validate output
        run: |
          python -c "
          import json, sys
          with open('egypt_railways.json', encoding='utf-8') as f:
              d = json.load(f)
          n = len(d['trains'])
          assert n > 100, f'Expected >100 trains, got {n}'
          assert d['dataVersion'] == 2
          assert all('id' in t and 'lineId' in t and 'stationIds' in t for t in d['trains'])
          print(f'OK: {n} trains, {len({s for t in d[\"trains\"] for s in t[\"stationIds\"]})} stations')
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egypt_railways.json
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: refresh egypt_railways.json (auto-scraped)"
            git push
          fi

      - name: Sync to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID:    ${{ secrets.GIST_ID }}
        run: |
          jq -nc --rawfile c egypt_railways.json '{files: {"egypt_railways.json": {content: $c}}}' > payload.json
          curl -fsSL -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "https://api.github.com/gists/$GIST_ID"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-railways-json
          path: egypt_railways.json
          retention-days: 14
